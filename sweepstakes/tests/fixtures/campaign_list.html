<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>懸賞まとめ (合成データ)</title></head>
<body>
<!-- テスト用の合成データ。URL は解決されない .example ドメインを使用 -->
<article class="campaign" data-kind="web_form" data-url="https://shop.sweep.example/campaign/autumn?utm_source=list"
  data-deadline="2099-12-31" data-prize-value="30000" data-winners="10" data-participants="5000" data-minutes="3">
  <h2 class="title">秋の合成プレゼント (ギフト券3万円分)</h2>
  <p class="prize">ギフト券 30,000円分</p>
  <div class="terms">お一人様1回限り。</div>
</article>

<article class="campaign" data-kind="web_form" data-url="https://foods.sweep.example/present"
  data-deadline="2000-01-01" data-prize-value="5000" data-winners="100" data-participants="10000">
  <h2 class="title">締切済みの合成キャンペーン</h2>
  <p class="prize">お菓子詰め合わせ</p>
</article>

<article class="campaign" data-kind="x" data-url="https://x.com/sweep_example/status/1"
  data-deadline="2099-12-01" data-prize-value="10000" data-winners="5" data-participants="20000" data-minutes="1">
  <h2 class="title">フォロー&amp;RTで合成グッズが当たる</h2>
  <p class="prize">合成グッズセット</p>
  <ul class="steps">
    <li data-action="follow" data-target="@sweep_example"></li>
    <li data-action="repost" data-target="https://x.com/sweep_example/status/1"></li>
  </ul>
</article>

<article class="campaign" data-kind="instagram" data-url="https://www.instagram.com/p/sweep-example/"
  data-deadline="2099-11-30" data-prize-value="8000" data-winners="3" data-participants="3000" data-minutes="2">
  <h2 class="title">合成コスメ プレゼント</h2>
  <p class="prize">合成コスメセット</p>
  <ul class="steps">
    <li data-action="follow" data-target="@sweep.example"></li>
    <li data-action="like" data-target="https://www.instagram.com/p/sweep-example/"></li>
    <li data-action="comment" data-target="https://www.instagram.com/p/sweep-example/">欲しい！</li>
  </ul>
</article>

<article class="campaign" data-kind="crypto_quest" data-url="https://app.galxe.com/quest/sweep-example"
  data-deadline="2099-10-31" data-prize-value="3000" data-winners="500" data-participants="20000" data-minutes="10">
  <h2 class="title">合成チェーン テストネットクエスト</h2>
  <p class="prize">NFT + ポイント</p>
  <ul class="steps">
    <li data-action="follow" data-target="@sweep_chain"></li>
    <li data-action="join_discord" data-target="https://discord.gg/sweep-example"></li>
    <li data-action="connect_wallet"></li>
  </ul>
</article>

<article class="campaign" data-kind="crypto_quest" data-url="https://uniswap-airdrop.example/claim"
  data-deadline="2099-10-31" data-prize-value="100000" data-winners="1000" data-participants="1000">
  <h2 class="title">エアドロップ受け取り (詐欺パターンの合成例)</h2>
  <p class="prize">UNI 1000枚</p>
  <div class="notes">受け取りにはウォレットの seed phrase を入力し、setApprovalForAll を承認してください。</div>
</article>
</body></html>
