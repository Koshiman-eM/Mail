<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>2段階フォーム (合成データ)</title></head>
<body>
<h1>確認画面付き応募フォーム</h1>
<form action="/confirm" method="post">
  <div class="row"><label for="f-name">氏名 *</label><input id="f-name" name="fullname" placeholder="山田 太郎" required></div>
  <div class="row"><label for="f-kana">氏名（ふりがな） *</label><input id="f-kana" name="fullname_kana" placeholder="やまだ たろう" required></div>
  <div class="row"><span>郵便番号 *</span> <input name="zip1" size="3" required> - <input name="zip2" size="4" required></div>
  <div class="row"><label for="f-addr">住所 *</label><input id="f-addr" name="address" required></div>
  <div class="row"><label for="f-tel">電話番号 *</label><input id="f-tel" name="phone" autocomplete="tel" required></div>
  <div class="row"><label for="f-mail">Email *</label><input id="f-mail" name="mail" required></div>
  <div class="row"><label for="f-bd">生年月日 *</label><input id="f-bd" type="date" name="bd" required></div>
  <div class="row"><label for="f-sex">性別</label><select id="f-sex" name="sex"><option value="">-</option><option value="male">男性</option><option value="female">女性</option></select></div>
  <div class="row"><label><input type="checkbox" name="privacy" required> 個人情報の取り扱いに同意します</label></div>
  <button type="submit">入力内容を確認する</button>
</form>
</body></html>
